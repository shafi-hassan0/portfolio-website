name: Trigger Backend Deploy

on:
  push:
    branches: [main]

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Check whether seed data changed
        id: diff
        run: |
          if git diff --name-only HEAD^ HEAD | grep -q '^src/seed/data/'; then
            echo "should_seed=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_seed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Dispatch portfolio-website-infra
        run: |
          curl -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.INFRA_DISPATCH_TOKEN }}" \
            https://api.github.com/repos/shafi-hassan0/portfolio-website-infra/dispatches \
            -d "{\"event_type\":\"backend-changed\",\"client_payload\":{\"sha\":\"${{ github.sha }}\",\"should_seed\":\"${{ steps.diff.outputs.should_seed }}\"}}"
